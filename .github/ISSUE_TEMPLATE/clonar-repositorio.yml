name: Clonar este repositório
description: Cria um repositório novo (privado) com uma cópia deste, já configurada.
title: "[clone] "
body:
  - type: markdown
    attributes:
      value: |
        Mantenha o `[clone]` no início do título. Só dono, membros e colaboradores disparam a automação.

        **Atenção:** o que você escrever aqui fica visível para quem pode ver este repositório (se for público, para qualquer pessoa). Nunca informe senha, chave ou token.
  - type: input
    id: repo_name
    attributes:
      label: Nome do novo repositório
      description: Letras, números, ponto, hífen e sublinhado (até 100 caracteres).
      placeholder: extract-dynamodb-vendas
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Nome do projeto
      description: "Prefixo dos recursos e pasta do tfstate. 3 a 30: minúsculas, números e hífen, começando por letra."
      placeholder: dynamodb-vendas
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Região AWS
      placeholder: us-east-1
    validations:
      required: true
  - type: input
    id: raw_bucket
    attributes:
      label: Nome do bucket RAW
      description: "Único no mundo. 3 a 51: minúsculas, números, ponto e hífen."
      placeholder: empresa-vendas-raw-001
    validations:
      required: true
  - type: input
    id: account_id
    attributes:
      label: Número da conta AWS
      description: 12 dígitos. Usado para o Data Lake e para a conta produtora.
      placeholder: "123456789012"
    validations:
      required: true
